name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://tapaksucisportacademy.com
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PUBLIC_PATH: ${{ secrets.PUBLIC_PATH }}
      PHP_BIN: ${{ secrets.PHP_BIN || 'php' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, dom, gd, zip, bcmath, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Create release archive
        run: |
          # Simpan arsip di luar workspace agar tar tidak membaca file yang
          # sedang ditulisnya sendiri ("file changed as we read it").
          ARCHIVE_PATH="$RUNNER_TEMP/tapak-suci-release.tar.gz"
          rm -f "$ARCHIVE_PATH"

          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.idea' \
            --exclude='./.vscode' \
            --exclude='./tests' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            --exclude='./storage' \
            --exclude='./public/storage' \
            --exclude='./public/hot' \
            --exclude='./bootstrap/cache/*.php' \
            --exclude='./database/*.sqlite' \
            --exclude='./.phpunit.result.cache' \
            --exclude='./.phpunit.cache' \
            --exclude='./release.tar.gz' \
            --exclude='./tapak-suci-release.tar.gz' \
            -czf "$ARCHIVE_PATH" .

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE_PATH"

      - name: Validate deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0

          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH PUBLIC_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name belum diisi."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          case "$DEPLOY_PATH" in
            /home/*) ;;
            *)
              echo "::error::DEPLOY_PATH harus berupa path absolut di /home/."
              exit 1
              ;;
          esac

          case "$PUBLIC_PATH" in
            /home/*) ;;
            *)
              echo "::error::PUBLIC_PATH harus berupa path absolut di /home/."
              exit 1
              ;;
          esac

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Normalisasi CRLF agar key hasil copy-paste dari Windows tetap valid.
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/tmp/ssh-key-error; then
            echo "::error::SSH_PRIVATE_KEY tidak valid atau memiliki passphrase."
            cat /tmp/ssh-key-error
            exit 1
          fi

          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key.pub | awk '{print $2}')"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases' \
              '$DEPLOY_PATH/shared/storage/app/public' \
              '$DEPLOY_PATH/shared/storage/framework/cache/data' \
              '$DEPLOY_PATH/shared/storage/framework/sessions' \
              '$DEPLOY_PATH/shared/storage/framework/views' \
              '$DEPLOY_PATH/shared/storage/logs' \
              '$PUBLIC_PATH'"

      - name: Upload release
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            -o ConnectTimeout=15 \
            "$ARCHIVE_PATH" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/release.tar.gz"

      - name: Deploy on server
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' PUBLIC_PATH='$PUBLIC_PATH' RELEASE_ID='$RELEASE_ID' PHP_BIN='$PHP_BIN' bash -s" <<'REMOTE'
          set -euo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH belum diisi}"
          : "${PUBLIC_PATH:?PUBLIC_PATH belum diisi}"
          : "${RELEASE_ID:?RELEASE_ID belum diisi}"

          case "$DEPLOY_PATH" in
            /home/*) ;;
            *)
              echo "ERROR: DEPLOY_PATH harus berada di bawah /home/."
              exit 1
              ;;
          esac

          case "$PUBLIC_PATH" in
            /home/*) ;;
            *)
              echo "ERROR: PUBLIC_PATH harus berada di bawah /home/."
              exit 1
              ;;
          esac

          APP_PATH="$DEPLOY_PATH"
          RELEASE_ID="${RELEASE_ID:0:12}"
          RELEASE_DIR="$APP_PATH/releases/$RELEASE_ID"

          if [ ! -f "$APP_PATH/shared/.env" ]; then
            echo "ERROR: $APP_PATH/shared/.env belum dibuat. Lihat docs/DEPLOYMENT-HOSTINGER.md."
            exit 1
          fi

          if ! grep -Eq '^DB_CONNECTION=mysql[[:space:]]*$' "$APP_PATH/shared/.env"; then
            echo "ERROR: DB_CONNECTION di $APP_PATH/shared/.env harus mysql."
            grep -E '^DB_CONNECTION=' "$APP_PATH/shared/.env" || true
            exit 1
          fi

          mkdir -p "$APP_PATH/releases" \
            "$APP_PATH/shared/storage/app/public" \
            "$APP_PATH/shared/storage/framework/cache/data" \
            "$APP_PATH/shared/storage/framework/sessions" \
            "$APP_PATH/shared/storage/framework/views" \
            "$APP_PATH/shared/storage/logs" \
            "$PUBLIC_PATH"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar --no-same-owner -xzf "$APP_PATH/release.tar.gz" -C "$RELEASE_DIR"
          rm -f "$APP_PATH/release.tar.gz"

          ln -sfn "$APP_PATH/shared/.env" "$RELEASE_DIR/.env"
          rm -rf "$RELEASE_DIR/storage"
          ln -sfn "$APP_PATH/shared/storage" "$RELEASE_DIR/storage"
          mkdir -p "$RELEASE_DIR/bootstrap/cache"
          chmod -R ug+rwx "$RELEASE_DIR/bootstrap/cache" || true

          ln -sfn "$RELEASE_DIR" "$APP_PATH/current"

          cd "$APP_PATH/current"
          "$PHP_BIN" artisan down --retry=60 || true
          trap '"$PHP_BIN" artisan up || true' EXIT

          "$PHP_BIN" artisan package:discover --ansi
          "$PHP_BIN" artisan config:clear
          "$PHP_BIN" artisan migrate --force --no-interaction
          # JANGAN menjalankan db:seed di sini. Deploy rutin tidak boleh menulis
          # data demo atau menimpa akun. Seeder produksi hanya dijalankan manual
          # sekali saat instalasi: db:seed --class=ProductionSeeder --force.
          "$PHP_BIN" artisan optimize:clear
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan route:cache
          "$PHP_BIN" artisan view:cache

          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete \
              --exclude='.well-known' \
              --exclude='index.php' \
              --exclude='storage' \
              "$APP_PATH/current/public/" "$PUBLIC_PATH/"
          else
            find "$PUBLIC_PATH" -mindepth 1 -maxdepth 1 \
              ! -name '.well-known' ! -name 'index.php' ! -name 'storage' \
              -exec rm -rf {} +
            cp -R "$APP_PATH/current/public/." "$PUBLIC_PATH/"
          fi

          cat > "$PUBLIC_PATH/index.php" <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists($maintenance = '__APP_PATH__/current/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require '__APP_PATH__/current/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once '__APP_PATH__/current/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP
          sed -i "s#__APP_PATH__#$APP_PATH#g" "$PUBLIC_PATH/index.php"

          rm -rf "$PUBLIC_PATH/storage"
          ln -s "$APP_PATH/shared/storage/app/public" "$PUBLIC_PATH/storage"

          find "$PUBLIC_PATH" -type d -exec chmod 755 {} \;
          find "$PUBLIC_PATH" -type f -exec chmod 644 {} \;

          chmod -R ug+rwx "$APP_PATH/shared/storage" || true
          find "$APP_PATH/shared/storage" -type d -exec chmod 775 {} \;
          find "$APP_PATH/shared/storage" -type f -exec chmod 664 {} \;
          chmod 600 "$APP_PATH/shared/.env" || true

          "$PHP_BIN" artisan queue:restart || true
          "$PHP_BIN" artisan up || true

          # Post-deploy health check
          curl -fsS --retry 3 --retry-delay 2 "https://tapaksucisportacademy.com/health" || { echo "Health check failed"; exit 1; }

          trap - EXIT

          # Diagnostik deploy (tidak mengekspos path rahasia).
          echo "DIAG release=$(basename "$(readlink -f "$APP_PATH/current")")"
          echo "DIAG resources=$(ls -1 "$APP_PATH/current/app/Filament/Resources" 2>/dev/null | tr '\n' ',')"
          echo "DIAG guardians_in_routes=$(grep -c 'admin/guardians' "$APP_PATH/current/bootstrap/cache/routes-v7.php" 2>/dev/null || echo 0)"
          echo "DIAG public_index_current_refs=$(grep -c 'current/vendor/autoload' "$PUBLIC_PATH/index.php" 2>/dev/null || echo 0)"
          echo "DIAG marker=$(printf '%s' "$RELEASE_ID" > "$PUBLIC_PATH/__deploy_marker.txt" && echo written)"

          # Diagnostik rute dari SAPI web (sementara, dihapus setelah dibaca).
          DIAG_FILE="$PUBLIC_PATH/__diag_${RELEASE_ID}.php"
          cat > "$DIAG_FILE" <<PHP
<?php
require '$APP_PATH/current/vendor/autoload.php';
\$app = require '$APP_PATH/current/bootstrap/app.php';
\$app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap();
\$routes = \$app['router']->getRoutes();
\$name = 'filament.admin.resources.guardians.index';
\$route = \$routes->getByName(\$name);
echo 'has=' . (\$route ? 'yes' : 'no') . "\n";
echo 'uri=' . (\$route ? \$route->uri() : '-') . "\n";
echo 'routes_count=' . count(\$routes) . "\n";
echo 'base=' . basename(base_path()) . "\n";
echo 'env=' . \$app->environment() . "\n";
echo 'app_url=' . config('app.url') . "\n";
echo 'routes_cached=' . (\$app->routesAreCached() ? 'yes' : 'no') . "\n";
echo 'routes_file=' . basename(\$app->getCachedRoutesPath()) . "\n";
echo 'routes_mtime=' . @date('c', @filemtime(\$app->getCachedRoutesPath())) . "\n";
echo 'opcache_validate=' . ini_get('opcache.validate_timestamps') . "\n";
echo 'host=' . (\$_SERVER['HTTP_HOST'] ?? '-') . "\n";
echo 'docroot=' . basename(\$_SERVER['DOCUMENT_ROOT'] ?? '-') . "\n";
PHP
          echo "DIAG web_sapi=$(curl -s "https://tapaksucisportacademy.com/__diag_${RELEASE_ID}.php" | tr '\n' ' ')"
          rm -f "$DIAG_FILE"

          cd "$APP_PATH/releases"
          ls -1dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf
          REMOTE

      - name: Verify public root
        run: |
          set -e
          status=$(curl -s -o /tmp/marker.txt -w '%{http_code}' "https://tapaksucisportacademy.com/__deploy_marker.txt" || true)
          echo "DIAG marker_http=$status"
          echo "DIAG marker_body=$(head -c 100 /tmp/marker.txt 2>/dev/null)"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "rm -f '$PUBLIC_PATH/__deploy_marker.txt'" || true
