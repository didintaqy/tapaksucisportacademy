name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, gd, zip, bcmath
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install image optimization binaries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y optipng pngquant gifsicle jpegoptim mysql-client
          # svgo is a node tool; install via npm globally
          npm install -g svgo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Setup database & seed
        run: |
          php artisan migrate:fresh --seed --force

      - name: Clear caches before tests
        run: |
          php artisan view:clear
          php artisan config:clear
          php artisan route:clear

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Smoke test application bootstrap
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
